name: Quality

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (iOS)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PROJECT: ScreenKitExamples.xcodeproj
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "build=$(xcodebuild -version | tail -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.build }}-${{ hashFiles('ScreenKitExamples.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme ScreenKitLab \
            -resolvePackageDependencies

      - name: Test ScreenKitLab
        env:
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ScreenKitLab-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        run: |
          xcodebuild -quiet \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            -skipMacroValidation \
            -project "$PROJECT" \
            -scheme ScreenKitLab \
            -destination "$DESTINATION" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            test

      - name: Test ToNaTo
        env:
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ToNaTo-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        run: |
          xcodebuild -quiet \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            -skipMacroValidation \
            -project "$PROJECT" \
            -scheme ToNaTo \
            -destination "$DESTINATION" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            test

      - name: Upload Xcode test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ScreenKitLab-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
            ${{ runner.temp }}/ToNaTo-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: warn
          retention-days: 14

  build-ios-18:
    name: Build (iOS 18 deployment target)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      PROJECT: ScreenKitExamples.xcodeproj
      DESTINATION: generic/platform=iOS
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '18.0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "build=$(xcodebuild -version | tail -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.build }}-ios18-${{ hashFiles('ScreenKitExamples.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.build }}-
            ${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme ScreenKitLab \
            -resolvePackageDependencies

      - name: Build ScreenKitLab for iOS 18
        run: |
          xcodebuild -quiet \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipMacroValidation \
            -project "$PROJECT" \
            -scheme ScreenKitLab \
            -destination "$DESTINATION" \
            build

      - name: Build ToNaTo for iOS 18
        run: |
          xcodebuild -quiet \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipMacroValidation \
            -project "$PROJECT" \
            -scheme ToNaTo \
            -destination "$DESTINATION" \
            build
