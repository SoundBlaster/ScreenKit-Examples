receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 128
    retry_on_failure:
      max_elapsed_time: 60s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    # Explicit, predictable names; duration values stay in seconds.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_constant_labels:
      included: [service.name, service.instance.id, screenkit.telemetry.source]
    metric_expiration: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
