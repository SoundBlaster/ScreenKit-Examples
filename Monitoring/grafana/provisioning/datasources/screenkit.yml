apiVersion: 1
prune: true
datasources:
  - name: ScreenKit Metrics
    uid: screenkit-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: screenkit-tempo
  - name: ScreenKit Traces
    uid: screenkit-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: screenkit-prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service_name
          - key: app.screen.name
            value: app_screen_name
        queries:
          - name: Settled duration
            query: 'histogram_quantile(0.95, sum by (le) (rate(screenkit_update_settled_duration_bucket{$$__tags}[1m])))'
