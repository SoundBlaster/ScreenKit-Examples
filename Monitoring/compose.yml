name: screenkit-monitor

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_BIND_ADDRESS:-127.0.0.1}:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on: [tempo]
    mem_limit: 256m
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3-ubuntu
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Explore's native trace waterfall requires Editor in Grafana OSS.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/screenkit.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo]
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
